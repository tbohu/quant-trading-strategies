<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}旺财A股AI量化分析系统{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold text-warning" href="/">
      <i class="bi bi-bar-chart-fill me-1"></i>旺财量化
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>总览
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/stocks' in request.url.path %}active{% endif %}" href="/stocks">
            <i class="bi bi-list-ul me-1"></i>自选股
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/portfolio' in request.url.path %}active{% endif %}" href="/portfolio">
            <i class="bi bi-briefcase me-1"></i>持仓风控
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/trading' in request.url.path %}active{% endif %}" href="/trading">
            <i class="bi bi-arrow-left-right me-1"></i>模拟交易
          </a>
        </li>
      </ul>
      <a href="/stocks/add" class="btn btn-warning btn-sm">
        <i class="bi bi-plus-circle me-1"></i>添加股票
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-3">
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-3 border-top border-secondary mt-4 small">
  旺财A股AI量化分析系统 — 仅供模拟研究，不构成投资建议
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
